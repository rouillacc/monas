<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a5c38">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AS Collège Claudie Haigneré</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" id="app-favicon" href="1000203112.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>
:root{
  --as-green:#1a5c38; --as-green-dark:#124027; --as-green-light:#e8f5e9;
  --as-black:#111827; --as-gray:#f3f4f6; --as-white:#ffffff;
  --blue:#2563eb; --orange:#f59e0b; --orange-2:#d97706; --red:#dc2626; --green-status:#16a34a;
  --bg:#f9fafb; --card:#ffffff; --text:#111827; --muted:#4b5563; --line:#e5e7eb;
  --radius:22px; --shadow:0 8px 24px rgba(26,92,56,.08); --shadow-sm:0 4px 12px rgba(26,92,56,.05); --nav-h:72px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;display:flex;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;outline:none}

#shell{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.1)}
header{background:linear-gradient(135deg,var(--as-green),var(--as-green-dark));color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 20px 20px;border-radius:0 0 30px 30px;box-shadow:0 10px 26px rgba(26,92,56,.35);z-index:10;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:48px;height:48px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.2);flex-shrink:0}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand h1{font-size:15px;font-weight:800;line-height:1.2;text-transform:uppercase}
.brand h1 span{color:rgba(255,255,255,.8);font-weight:600;font-size:13px}
.head-right{display:flex;align-items:center;gap:8px}
.net-pill{font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff}
.net-pill.offline{background:#f59e0b;color:#111827}
.icon-btn{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.15);color:#fff;font-size:20px;display:grid;place-items:center;transition:.2s}
.icon-btn:active{transform:scale(.92)}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 16px calc(var(--nav-h) + 28px);scroll-behavior:smooth}
main.no-nav{padding-bottom:28px}
main::-webkit-scrollbar{width:0}

.flash-banner{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #f59e0b;color:#78350f;border-radius:18px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px;font-size:13px;font-weight:700;line-height:1.4;box-shadow:var(--shadow-sm)}
.card,.form-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden;border:1px solid rgba(26,92,56,.08)}
.card.past{background:#f3f4f6;opacity:.88;border-color:var(--line)}
.card-flex{display:flex;gap:14px;align-items:flex-start}
.event-thumb{width:54px;height:54px;border-radius:16px;flex-shrink:0;display:grid;place-items:center;font-size:26px;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.12)}
.event-info{flex:1;min-width:0}
.badges-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--as-black);color:#fff;font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;text-transform:uppercase}
.badge.gray{background:#d1d5db;color:var(--muted)}
.badge.red{background:var(--red);color:#fff}
.badge.countdown{background:var(--as-green-light);color:var(--as-green-dark)}
.card h3{font-size:18px;font-weight:800;margin:0 0 8px;line-height:1.25;color:var(--as-green-dark)}
.meta{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13px;font-weight:600}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.desc{margin-top:12px;background:var(--as-gray);border-radius:14px;padding:12px;font-size:13px;color:var(--as-black);line-height:1.45}
.registered-stripe{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--as-green)}
.waitlist-stripe{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--orange)}

.gauge{margin-top:14px}
.gauge-top{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:6px;text-transform:uppercase}
.gauge-bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.gauge-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--as-green),#22c55e);transition:width .4s}
.gauge-fill.warn{background:linear-gradient(90deg,var(--orange),var(--orange-2))}
.gauge-fill.full{background:linear-gradient(90deg,var(--red),#f87171)}

.btn{width:100%;padding:14px;border-radius:15px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,var(--as-green),var(--as-green-dark));color:#fff;box-shadow:0 6px 16px rgba(26,92,56,.25)}
.btn-orange{background:var(--as-black);color:#fff}
.btn-waitlist{background:#fef3c7;color:#92400e;border:2px solid #f59e0b}
.btn-success{background:var(--as-green-light);color:var(--as-green-dark);border:2px solid var(--as-green)}
.btn-ghost{background:var(--as-gray);color:var(--as-black)}
.btn-danger{background:#fee2e2;color:var(--red)}
.btn-disabled{background:var(--as-gray);color:var(--muted);border:2px solid #d1d5db}
.icon-action{background:var(--as-gray);color:var(--as-black);width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px}

.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--as-black);margin:0 0 6px 4px;text-transform:uppercase;letter-spacing:.03em}
.input{width:100%;background:var(--as-gray);border:2px solid transparent;border-radius:14px;padding:12px 14px;font-size:15px;color:var(--text);font-weight:600;transition:.2s}
.input:focus{outline:none;background:#fff;border-color:var(--as-green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:24px}
.hero-icon{width:100px;height:100px;border-radius:28px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.hero-icon img{width:100%;height:100%;object-fit:cover}
.code-input{text-align:center;font-weight:800;font-size:20px;letter-spacing:.14em;text-transform:uppercase}
.link{color:var(--as-green);font-weight:800;font-size:14px;padding:10px;display:inline-block}

nav{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);height:var(--nav-h);background:var(--as-black);border-radius:26px;box-shadow:0 10px 35px rgba(0,0,0,.25);display:flex;padding:6px;z-index:20}
nav button{flex:1;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:800;color:rgba(255,255,255,.6);transition:.2s}
nav button.active{background:rgba(255,255,255,.16);color:#fff}

.profile{margin-bottom:16px;background:linear-gradient(135deg,var(--as-green),var(--as-green-dark));padding:16px 18px;border-radius:22px;color:#fff;box-shadow:var(--shadow)}
.profile-top{display:flex;align-items:center;justify-content:space-between}
.profile h2{font-size:19px;font-weight:800;margin-top:2px}
.avatar{width:48px;height:48px;border-radius:16px;background:#fff;color:var(--as-green-dark);display:grid;place-items:center;font-weight:800;font-size:22px}
.profile-stats{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700}
.tier-badge{background:rgba(255,255,255,.18);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800}

.section-title{font-size:18px;font-weight:800;margin:12px 4px 12px;display:flex;align-items:center;gap:8px;color:var(--as-black)}
.empty{text-align:center;color:var(--muted);padding:32px 16px;background:rgba(255,255,255,.6);border:2px dashed #d1d5db;border-radius:var(--radius);font-weight:600;font-size:14px}

.admin-banner{background:var(--as-black);color:#fff;border-radius:18px;padding:12px 16px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border-radius:18px;padding:14px 10px;text-align:center;box-shadow:var(--shadow-sm);border:1px solid rgba(26,92,56,.08)}
.stat b{display:block;font-size:28px;font-weight:800;color:var(--as-green)}
.stat span{font-size:11px;font-weight:800;color:var(--as-black);text-transform:uppercase}
.inscrits-chip{display:flex;justify-content:space-between;align-items:center;background:var(--as-gray);border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:800;font-size:13px;cursor:pointer}

/* PLANNING HEBDO */
.plan-card{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid rgba(26,92,56,.08)}
.plan-day{font-size:11px;font-weight:900;text-transform:uppercase;color:var(--as-green);letter-spacing:.05em}
.plan-title{font-size:17px;font-weight:800;color:var(--as-black);margin:2px 0 4px}
.plan-meta{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px}

/* APPEL & FILTRES */
.switch-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#e5e7eb;padding:4px;border-radius:14px;margin-bottom:14px}
.switch-tabs.three{grid-template-columns:1fr 1fr 1fr}
.switch-tabs button{padding:10px 6px;border-radius:11px;font-weight:800;font-size:12px;color:var(--muted)}
.switch-tabs button.active{background:#fff;color:var(--as-green);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.att-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;user-select:none;transition:.15s}
.att-row.clickable{cursor:pointer}
.att-row.clickable:active{transform:scale(.985)}
.att-row.is-present{border-color:var(--as-green);background:var(--as-green-light)}
.att-pill{min-width:84px;text-align:center;padding:8px 10px;border-radius:10px;font-size:12px;font-weight:900;background:var(--as-gray);color:var(--muted)}
.att-row.is-present .att-pill{background:var(--as-green);color:#fff}
.status-bar{display:flex;justify-content:space-between;align-items:center;background:var(--as-black);color:#fff;padding:13px 16px;border-radius:14px;margin-bottom:12px;font-weight:800;font-size:14px}
.cat-pill{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:800;background:#e2e8f0;color:#334155;margin-left:4px}
.cat-pill.B{background:#dbeafe;color:#1d4ed8}
.cat-pill.M{background:#fce7f3;color:#be185d}
.cat-pill.G{background:#fef3c7;color:#b45309}
.cat-pill.REG{background:var(--as-green-light);color:var(--as-green-dark)}

#toasts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 74px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none}
.toast{background:var(--as-black);color:#fff;padding:12px 18px;border-radius:16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:10px;max-width:92%;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.toast.out{opacity:0;transform:translateY(-8px);transition:.25s}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>

<body>
<div id="shell">
  <header>
    <div class="brand">
      <div class="brand-logo"><img src="1000203112.jpg" alt="Logo AS"></div>
      <h1>AS Claudie<br><span>Haigneré</span></h1>
    </div>
    <div class="head-right">
      <span id="net-status" class="net-pill hidden"></span>
      <div id="header-actions"></div>
    </div>
  </header>

  <main id="view"></main>
  <nav id="nav" class="hidden"></nav>
  <div id="toasts"></div>
</div>

<!-- MODAL BASE LICENCIÉS -->
<div id="roster-modal" style="position:fixed;inset:0;background:rgba(17,24,39,.6);z-index:9999;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:14px;" onclick="if(event.target===this)this.style.display='none'">
  <div style="background:#fff;width:100%;max-width:460px;border-radius:22px;padding:20px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.4);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <h3 style="font-size:18px;font-weight:800;">👥 Base Licenciés (<span id="roster-total-count">0</span>)</h3>
      <button onclick="document.getElementById('roster-modal').style.display='none'" style="width:34px;height:34px;background:#fee2e2;color:var(--red);border-radius:50%;font-weight:800;font-size:18px;">×</button>
    </div>
    <div class="grid2" style="margin-bottom:8px;">
      <input class="input" id="new-lastname" placeholder="Nom">
      <input class="input" id="new-firstname" placeholder="Prénom">
      <input class="input" id="new-class" placeholder="Classe (ex: 5B)">
      <select class="input" id="new-sexe"><option value="G">Garçon (G)</option><option value="F">Fille (F)</option></select>
    </div>
    <div class="grid2" style="margin-bottom:10px;">
      <input class="input" id="new-birth" type="date" title="Date de naissance">
      <button class="btn btn-primary" type="button" onclick="addStudentManual()">+ Ajouter</button>
    </div>
    <div id="roster-list" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-top:6px;"></div>
    <div style="margin-top:14px;padding:12px;border:2px dashed var(--line);border-radius:14px;text-align:center;background:var(--bg);">
      <label style="cursor:pointer;font-weight:800;color:var(--as-green);display:block;font-size:13px;">
        📥 Importer CSV Licenciés (Nom ; Prénom ; Classe ; Sexe ; Date)
        <input type="file" id="csv-file" accept=".csv,text/csv" style="display:none;" onchange="importCSV(event)">
      </label>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, setDoc, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCmV2E6dhnXPDNjjMkVQHI8IH2nXKQByvc",
  authDomain: "appel-as.firebaseapp.com",
  projectId: "appel-as",
  storageBucket: "appel-as.firebasestorage.app",
  messagingSenderId: "943879688117",
  appId: "1:943879688117:web:0ddb0d3ce3801b07ff13fc"
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});
const auth = getAuth(app);

const ADMIN_EMAIL = 'epsclaudie@gmail.com';
const ACCESS_CODE = 'ROUILLAC16';

const C_EVENTS = collection(db, 'as_events');
const C_INSCRIPT = collection(db, 'as_inscriptions');
const C_USERS = collection(db, 'as_users');
const C_LICENCIES = collection(db, 'as_licencies');
const C_ATTENDANCE = collection(db, 'as_attendance');
const DOC_SETTINGS = doc(db, 'as_settings', 'main');

const DAY_LABELS = { 1:'Lundi', 2:'Mardi', 4:'Jeudi', 5:'Vendredi' };
const DEFAULT_SCHEDULE = {
  1: { name:'Futsal', hours:'12h30 - 13h30', place:'Gymnase' },
  2: { name:'Sports collectifs', hours:'12h30 - 13h30', place:'Gymnase' },
  4: { name:'Activités artistiques', hours:'12h30 - 13h30', place:'Salle de danse' },
  5: { name:'Badminton', hours:'12h30 - 13h30', place:'Gymnase' }
};

function normalizeSlot(slot, fallback) {
  if (!slot) return fallback || { name:'', hours:'', place:'' };
  if (typeof slot === 'string') return { name:slot, hours:'12h30 - 13h30', place:'Gymnase' };
  return { name:slot.name||'', hours:slot.hours||'', place:slot.place||'' };
}

const getToday = () => {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().split('T')[0];
};

const S = {
  view:'loading', tab:'upcoming', user:null, profile:null, isAdmin:false,
  events:[], inscriptions:[], users:[], licencies:[], attendance:[],
  schedule:{ ...DEFAULT_SCHEDULE }, flashInfo:'', unsubs:[], detailId:null, editId:null,
  studentFilter:'all',
  attType:'training', attDate:getToday(), attEventId:'', attCat:'', attStatus:'all', attSearch:'',
  bilanSearch:''
};

const $view = document.getElementById('view');
const $nav = document.getElementById('nav');
const $head = document.getElementById('header-actions');

/* --- INDICATEUR HORS-LIGNE --- */
function updateNetBadge() {
  const el = document.getElementById('net-status');
  if (!el) return;
  if (navigator.onLine) { el.classList.add('hidden'); }
  else { el.textContent = '📡 Hors-ligne'; el.className = 'net-pill offline'; }
}
window.addEventListener('online', () => { updateNetBadge(); toast('Connexion retrouvée · Synchro en cours', 'info'); });
window.addEventListener('offline', () => { updateNetBadge(); toast('Mode hors-ligne actif', 'info'); });
updateNetBadge();

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
const fmtDate = d => {
  if (!d) return '';
  const dt = new Date(d + 'T12:00:00');
  return isNaN(dt) ? d : dt.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
};
const countdownLabel = d => {
  const diff = Math.round((new Date(d + 'T12:00:00') - new Date(getToday() + 'T12:00:00')) / 86400000);
  if (diff === 0) return "Aujourd'hui";
  if (diff === 1) return 'Demain';
  if (diff > 1) return `Dans ${diff} j`;
  return '';
};
const slugify = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
const fullName = st => `${String(st.lastname||'').toUpperCase()} ${st.firstname||''}`.trim();
const shortName = st => `${st.firstname||''} ${String(st.lastname||'').trim().charAt(0).toUpperCase()}.`.trim();
const activeLicencies = () => S.licencies.filter(l => l.active !== false);

/* --- CATÉGORIE UNSS PAR ÂGE --- */
function getCategory(st) {
  const raw = String(st.dateNaissance || st.birthdate || '').trim();
  if (raw) {
    const m = raw.match(/(\d{4})/);
    if (m) {
      const birthYear = parseInt(m[1], 10);
      const now = new Date();
      const refYear = now.getMonth() >= 7 ? now.getFullYear() : now.getFullYear() - 1;
      const age = refYear - birthYear;
      if (age <= 12) return 'B';
      if (age === 13 || age === 14) return 'M';
      return 'A';
    }
  }
  const cl = String(st.class || '').toLowerCase();
  if (cl.includes('6') || cl.includes('5')) return 'B';
  if (cl.includes('4') || cl.includes('3')) return 'M';
  return 'A';
}

/* --- INSCRIPTIONS & LISTE D'ATTENTE AUTOMATIQUE --- */
function getEventRegistrations(eventId) {
  return S.inscriptions
    .filter(i => i.eventId === eventId)
    .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
}

function getStudentRegStatus(e, licId) {
  if (!licId) return { status:'none' };
  const regs = getEventRegistrations(e.id);
  const idx = regs.findIndex(r => r.userId === licId);
  if (idx === -1) return { status:'none' };
  const max = Number(e.places) || 0;
  if (max > 0 && idx >= max) return { status:'waitlist', pos: idx - max + 1 };
  return { status:'confirmed', pos: idx + 1 };
}

function getEventTheme(titre, desc = '') {
  const t = (titre + ' ' + desc).toLowerCase();
  if (t.includes('futsal') || t.includes('foot')) return { emoji:'⚽', color:'linear-gradient(135deg,#059669,#047857)' };
  if (t.includes('basket')) return { emoji:'🏀', color:'linear-gradient(135deg,#d97706,#b45309)' };
  if (t.includes('hand')) return { emoji:'🤾', color:'linear-gradient(135deg,#0284c7,#0369a1)' };
  if (t.includes('volley')) return { emoji:'🏐', color:'linear-gradient(135deg,#ca8a04,#a16207)' };
  if (t.includes('rugby')) return { emoji:'🏉', color:'linear-gradient(135deg,#7c3aed,#6d28d9)' };
  if (t.includes('bad')) return { emoji:'🏸', color:'linear-gradient(135deg,#7c3aed,#6d28d9)' };
  if (t.includes('cross') || t.includes('run')) return { emoji:'🏃', color:'linear-gradient(135deg,#dc2626,#b91c1c)' };
  if (t.includes('escalade')) return { emoji:'🧗', color:'linear-gradient(135deg,#475569,#334155)' };
  if (t.includes('swim') || t.includes('natation')) return { emoji:'🏊', color:'linear-gradient(135deg,#0891b2,#0e7490)' };
  if (t.includes('raid') || t.includes('orientation')) return { emoji:'🧭', color:'linear-gradient(135deg,#65a30d,#4d7c0f)' };
  if (t.includes('gym') || t.includes('artist')) return { emoji:'🤸', color:'linear-gradient(135deg,#c026d3,#a21caf)' };
  return { emoji:'🏆', color:'linear-gradient(135deg,var(--as-green),var(--as-green-dark))' };
}

window.toast = (msg, type = 'success') => {
  const ic = { success:'ph-check-circle', error:'ph-warning-circle', info:'ph-info' }[type] || 'ph-info';
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<i class="ph-fill ${ic}"></i><span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 250); }, 2800);
};

/* --- AUTH & SYNC --- */
let regLock = false;
onSnapshot(C_LICENCIES, snap => {
  S.licencies = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  if (S.view === 'register' || S.user) render();
});

onAuthStateChanged(auth, async user => {
  if (regLock) return;
  S.unsubs.forEach(u => u()); S.unsubs = [];
  if (!user) {
    Object.assign(S, { user:null, profile:null, isAdmin:false, tab:'upcoming', view:'guard' });
    render(); return;
  }
  S.user = user;
  S.isAdmin = (user.email || '').toLowerCase() === ADMIN_EMAIL;
  if (S.isAdmin) {
    S.profile = { role:'admin', prenom:'Professeur', nom:'EPS' };
  } else {
    const snap = await getDoc(doc(C_USERS, user.uid));
    if (!snap.exists()) { await signOut(auth); toast('Compte introuvable.', 'error'); return; }
    S.profile = snap.data();
  }
  S.view = S.isAdmin ? 'admin' : 'student';

  S.unsubs.push(onSnapshot(C_EVENTS, s => { S.events = s.docs.map(d => ({ id:d.id, ...d.data() })); render(); }));
  S.unsubs.push(onSnapshot(C_INSCRIPT, s => { S.inscriptions = s.docs.map(d => ({ id:d.id, ...d.data() })); render(); }));
  S.unsubs.push(onSnapshot(C_ATTENDANCE, s => { S.attendance = s.docs.map(d => ({ id:d.id, ...d.data() })); render(); }));
  S.unsubs.push(onSnapshot(DOC_SETTINGS, s => {
    if (s.exists()) {
      const d = s.data();
      if (d.schedule) {
        const merged = {};
        [1,2,4,5].forEach(k => { merged[k] = normalizeSlot(d.schedule[k], DEFAULT_SCHEDULE[k]); });
        S.schedule = merged;
      }
      S.flashInfo = d.flashInfo || '';
    }
    render();
  }));
  if (S.isAdmin) {
    S.unsubs.push(onSnapshot(C_USERS, s => { S.users = s.docs.map(d => ({ id:d.id, ...d.data() })); render(); }));
  }
  render();
});

const upcomingEvents = () => S.events.filter(e => e.date >= getToday() && !e.isPast).sort((a,b) => a.date.localeCompare(b.date));
const pastEvents = () => S.events.filter(e => e.date < getToday() || e.isPast).sort((a,b) => b.date.localeCompare(a.date));

function studentPresenceCount(licId) {
  return S.attendance.reduce((n, sess) => n + ((sess.presentIds || []).includes(licId) ? 1 : 0), 0);
}

function getTierBadge(count) {
  if (count >= 30) return '🥇 Or';
  if (count >= 15) return '🥈 Argent';
  if (count >= 5) return '🥉 Bronze';
  return '🌱 Débutant';
}

/* --- APPEL NATIF --- */
const trainingSlotFor = dateStr => normalizeSlot(S.schedule[new Date(dateStr + 'T12:00:00').getDay()]);
const trainingActivityFor = dateStr => trainingSlotFor(dateStr).name;
const currentAttId = () => S.attType === 'training'
  ? `training_${S.attDate}_${slugify(trainingActivityFor(S.attDate))}`
  : `comp_${S.attEventId}`;
const currentAttSession = () => S.attendance.find(a => a.id === currentAttId()) || null;

async function saveAttPatch(patch) {
  const id = currentAttId();
  const existing = currentAttSession() || {};
  const evt = S.events.find(e => e.id === S.attEventId);
  const data = {
    type: S.attType,
    date: S.attType === 'training' ? S.attDate : (evt?.date || S.attDate),
    activity: S.attType === 'training' ? trainingActivityFor(S.attDate) : (evt?.titre || 'Compétition'),
    eventId: S.attType === 'competition' ? S.attEventId : '',
    presentIds: existing.presentIds || [],
    guests: existing.guests || [],
    updatedAt: Date.now(),
    ...patch
  };
  await setDoc(doc(C_ATTENDANCE, id), data, { merge:true });
}

window.setAttType = t => {
  S.attType = t;
  if (t === 'competition' && !S.attEventId) S.attEventId = upcomingEvents()[0]?.id || S.events[0]?.id || '';
  render();
};

window.toggleAtt = async (id, isGuest = false) => {
  const sess = currentAttSession() || {};
  const present = new Set(sess.presentIds || []);
  const wasPresent = present.has(id);
  wasPresent ? present.delete(id) : present.add(id);
  await saveAttPatch({ presentIds: [...present] });

  if (S.attType === 'competition' && !isGuest && S.attEventId && !wasPresent) {
    const regId = `${S.attEventId}_${id}`;
    if (!S.inscriptions.some(i => i.id === regId)) {
      await setDoc(doc(C_INSCRIPT, regId), { eventId:S.attEventId, userId:id, timestamp:Date.now(), source:'appel' });
    }
  }
};

window.addGuestStudent = async () => {
  const l = document.getElementById('guest-last').value.trim();
  const f = document.getElementById('guest-first').value.trim();
  if (!l || !f) return toast('Nom et prénom requis', 'error');
  const sess = currentAttSession() || {};
  const guest = { id:'guest_' + Date.now(), lastname:l, firstname:f };
  await saveAttPatch({
    guests: [...(sess.guests || []), guest],
    presentIds: [...new Set([...(sess.presentIds || []), guest.id])]
  });
  document.getElementById('guest-last').value = '';
  document.getElementById('guest-first').value = '';
  toast(`${f} ${l.toUpperCase()} ajouté(e) présent(e) !`);
};

window.exportCompPDF = () => {
  const evt = S.events.find(e => e.id === S.attEventId);
  const sess = currentAttSession();
  if (!evt || !sess) return toast('Aucun présent enregistré', 'error');
  const pSet = new Set(sess.presentIds || []);
  const presentLics = S.licencies.filter(l => pSet.has(l.id));
  const presentGuests = (sess.guests || []).filter(g => pSet.has(g.id));
  const total = presentLics.length + presentGuests.length;
  if (!total) return toast('Aucun élève présent', 'error');

  const groups = {
    'Benjamines (BF)': [],
    'Benjamins (BG)': [],
    'Minimes Filles (MF)': [],
    'Minimes Garçons (MG)': [],
    'Autres': [],
    'Hors-liste': presentGuests.sort((a,b) => fullName(a).localeCompare(fullName(b), 'fr'))
  };

  presentLics.forEach(p => {
    const c = getCategory(p), sx = (p.sexe || 'G').toUpperCase().charAt(0);
    if (c === 'B' && sx === 'F') groups['Benjamines (BF)'].push(p);
    else if (c === 'B') groups['Benjamins (BG)'].push(p);
    else if (c === 'M' && sx === 'F') groups['Minimes Filles (MF)'].push(p);
    else if (c === 'M') groups['Minimes Garçons (MG)'].push(p);
    else groups['Autres'].push(p);
  });

  const pdf = new window.jspdf.jsPDF();
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(15); pdf.setTextColor(26, 92, 56);
  pdf.text('AS CLAUDIE HAIGNERE - FEUILLE DE ROUTE', 15, 18);
  pdf.setFontSize(11); pdf.setTextColor(17, 24, 39);
  pdf.text(`Compétition : ${evt.titre}`, 15, 27);
  pdf.text(`Date : ${fmtDate(evt.date)}  |  Lieu : ${evt.lieu || '-'}  |  Présents : ${total}`, 15, 34);

  let y = 46;
  Object.entries(groups).forEach(([title, arr]) => {
    if (!arr.length) return;
    arr.sort((a,b) => fullName(a).localeCompare(fullName(b), 'fr'));
    if (y > 268) { pdf.addPage(); y = 20; }
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11); pdf.setTextColor(26, 92, 56);
    pdf.text(`${title} (${arr.length})`, 15, y);
    y += 6;
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(10); pdf.setTextColor(17, 24, 39);
    arr.forEach((p, idx) => {
      if (y > 278) { pdf.addPage(); y = 20; }
      const u = S.users.find(x => x.licencieId === p.id);
      const tel = u?.telResponsable ? `  |  Tél: ${u.telResponsable}` : '';
      const cl = p.class ? ` (${p.class})` : '';
      pdf.text(`${idx+1}. ${fullName(p)}${cl}${tel}`, 18, y);
      y += 6.5;
    });
    y += 4;
  });

  pdf.save(`Presents_${evt.date}.pdf`);
  toast('PDF téléchargé 📄');
};

function renderAppelView() {

  let list = [];

  if (S.attType === 'training') {
    activity = trainingActivityFor(S.attDate);
    const prev = S.attendance
      .filter(a => a.type === 'training' && a.activity === activity && a.date < S.attDate)
      .sort((a,b) => b.date.localeCompare(a.date))[0];
    const prevSet = new Set(prev?.presentIds || []);
    list = [...activeLicencies()].sort((a,b) => {
      const pa = prevSet.has(a.id) ? 0 : 1, pb = prevSet.has(b.id) ? 0 : 1;
      return pa !== pb ? pa - pb : fullName(a).localeCompare(fullName(b), 'fr');
    });
  } else {
    const evts = [...S.events].sort((a,b) => a.date.localeCompare(b.date));
    if (!S.attEventId && evts.length) S.attEventId = upcomingEvents()[0]?.id || evts[0].id;
    regSet = new Set(getEventRegistrations(S.attEventId).map(i => i.userId));
    list = [...activeLicencies()].sort((a,b) => {
      const ra = regSet.has(a.id) ? 0 : 1, rb = regSet.has(b.id) ? 0 : 1;
      return ra !== rb ? ra - rb : fullName(a).localeCompare(fullName(b), 'fr');
    });
  }

  const term = S.attSearch.toLowerCase();
  const filtered = list.filter(st => {
    const isP = presentSet.has(st.id);
    if (S.attStatus === 'present' && !isP) return false;
    if (S.attStatus === 'absent' && isP) return false;
    if (S.attCat && getCategory(st) !== S.attCat) return false;
    if (term && !fullName(st).toLowerCase().includes(term)) return false;
    return true;
  });

  const filteredGuests = guests.filter(g => {
    const isP = presentSet.has(g.id);
    if (S.attStatus === 'present' && !isP) return false;
    if (S.attStatus === 'absent' && isP) return false;
    if (term && !fullName(g).toLowerCase().includes(term)) return false;
    return true;

  const totalPresents = list.filter(s => presentSet.has(s.id)).length + guests.filter(g => presentSet.has(g.id)).length;

  return `
    <div class="admin-banner"><i class="ph-fill ph-clipboard-text" style="font-size:22px;color:var(--as-green-light)"></i>Appel & Présences</div>
    <div class="switch-tabs">
      <button class="${S.attType==='training'?'active':''}" onclick="setAttType('training')">🏃 Entraînement</button>
      <button class="${S.attType==='competition'?'active':''}" onclick="setAttType('competition')">🏆 Compétition</button>
    </div>

    <div class="card">
      ${S.attType === 'training' ? `
        <div class="field"><label>Date</label><input class="input" type="date" value="${S.attDate}" onchange="S.attDate=this.value;render()"></div>
        <div style="background:var(--as-green-light);color:var(--as-green-dark);padding:10px 14px;border-radius:12px;font-weight:800;font-size:14px;">
          ${activity ? `📅 Créneau : ${esc(activity)}` : '⚠️ Aucun créneau prévu ce jour'}
        </div>
      ` : `
        <div class="field"><label>Compétition</label>
          <select class="input" onchange="S.attEventId=this.value;render()">
            ${S.events.sort((a,b)=>a.date.localeCompare(b.date)).map(e => `<option value="${e.id}" ${e.id===S.attEventId?'selected':''}>${esc(fmtDate(e.date))} · ${esc(e.titre)}</option>`).join('') || '<option value="">Aucun événement</option>'}
          </select>
        </div>
        <button class="btn btn-orange" onclick="exportCompPDF()"><i class="ph-bold ph-file-pdf"></i> Exporter PDF des présents</button>

/* --- CARTES ÉVÉNEMENTS --- */
function gaugeHTML(e, totalRegs) {
  const max = Number(e.places) || 0;
  if (!max) return '';
  const confirmed = Math.min(totalRegs, max);
  const waitlist = Math.max(0, totalRegs - max);
  const pct = Math.min(100, Math.round((confirmed / max) * 100));
  const left = Math.max(0, max - confirmed);
  const cls = e.inscriptionsClosed || left === 0 ? 'full' : pct >= 75 ? 'warn' : '';
  const rightTxt = e.inscriptionsClosed ? 'Fermées' : left === 0 ? `Complet${waitlist ? ` (+${waitlist} att.)` : ''}` : `${left} dispo`;
  return `<div class="gauge"><div class="gauge-top"><span>👥 ${confirmed} / ${max}</span><span>${rightTxt}</span></div><div class="gauge-bar"><div class="gauge-fill ${cls}" style="width:${pct}%"></div></div></div>`;
}

/* --- FEUILLE DÉTAIL INSCRITS --- */
function renderSheet() {
  const old = document.getElementById('sheet');
  if (!S.detailId) { old?.remove(); return; }
  const e = S.events.find(x => x.id === S.detailId);
  if (!e) { S.detailId = null; old?.remove(); return; }

  const regs = getEventRegistrations(e.id);
  const max = Number(e.places) || 0;
  const confirmedIds = max > 0 ? regs.slice(0, max).map(r => r.userId) : regs.map(r => r.userId);
  const waitlistIds = max > 0 ? regs.slice(max).map(r => r.userId) : [];

  const confirmed = S.licencies.filter(l => confirmedIds.includes(l.id)).sort((a,b) => fullName(a).localeCompare(fullName(b), 'fr'));
  const waitlist = waitlistIds.map(id => S.licencies.find(l => l.id === id)).filter(Boolean);

  const groups = { BF:[], BG:[], MF:[], MG:[], Autre:[] };
  confirmed.forEach(p => {
    const cat = getCategory(p), sx = (p.sexe || 'G').toUpperCase().charAt(0) === 'F' ? 'F' : 'G';
    if (cat === 'B') groups['B'+sx].push(p);
    else if (cat === 'M') groups['M'+sx].push(p);
    else groups.Autre.push(p);
  });

  const rowHTML = (p, prefix = '') => {
    const u = S.users.find(x => x.licencieId === p.id);
    const tel = u?.telResponsable;
    return `<div class="att-row">
      <div>
        <strong>${prefix}${esc(S.isAdmin ? fullName(p) : shortName(p))}</strong>
        <div style="font-size:12px;color:var(--muted);">${S.isAdmin ? `Classe ${esc(p.class||'-')}${tel?' · '+esc(tel):''}` : 'Licencié(e) AS'}</div>
      </div>
      ${S.isAdmin && tel ? `<a href="tel:${esc(tel)}" style="width:40px;height:40px;background:var(--green-status);color:#fff;border-radius:12px;display:grid;place-items:center;text-decoration:none;"><i class="ph-fill ph-phone"></i></a>` : ''}
    </div>`;
  };

  const block = (title, arr) => !arr.length ? '' : `
    <div style="margin:16px 0 8px;font-weight:800;font-size:14px;border-bottom:2px solid var(--line);padding-bottom:4px;">${title} (${arr.length})</div>
    ${arr.map(p => rowHTML(p)).join('')}`;

  const html = `<div id="sheet" style="position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;">
    <div style="background:var(--as-black);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 18px;display:flex;align-items:center;gap:12px;">
      <button class="icon-btn" data-a="close-detail"><i class="ph-bold ph-arrow-left"></i></button>
      <h2 style="font-size:17px;font-weight:800;">${esc(e.titre)}</h2>
    </div>
    <div style="flex:1;overflow-y:auto;padding:18px 16px;">
      <h3 style="color:var(--as-green-dark);">👥 Inscrits confirmés (${confirmed.length})</h3>
      ${block('Benjamines (BF)', groups.BF)}
      ${block('Benjamins (BG)', groups.BG)}
      ${block('Minimes Filles (MF)', groups.MF)}
      ${block('Minimes Garçons (MG)', groups.MG)}
      ${block('Autres', groups.Autre)}
      ${waitlist.length ? `<div style="margin:22px 0 8px;font-weight:800;font-size:14px;color:#b45309;border-bottom:2px solid #fde68a;padding-bottom:4px;">⏳ Liste d'attente (${waitlist.length})</div>${waitlist.map((p, i) => rowHTML(p, `#${i+1} · `)).join('')}` : ''}
      ${!confirmed.length && !waitlist.length ? '<div class="empty" style="margin-top:16px;">Aucun inscrit.</div>' : ''}
    </div>
  </div>`;
  if (old) old.outerHTML = html;
  else document.getElementById('shell').insertAdjacentHTML('beforeend', html);
}

window.importCSV = e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = async evt => {
    const lines = evt.target.result.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const batch = writeBatch(db);
    let added = 0;
    lines.forEach((l, idx) => {
      let parts = l.split(';').map(p => p.replace(/^"|"$/g, '').trim());
      if (idx === 0 && parts[0].toLowerCase().includes('nom')) return;
      if (/^[0-9]{4,}$/.test(parts[0])) parts.shift();
      const [nom, prenom, classe='', sexeRaw='', dateRaw=''] = parts;
      if (!nom || !prenom) return;
      const exists = S.licencies.some(s => (s.lastname||'').toLowerCase() === nom.toLowerCase() && (s.firstname||'').toLowerCase() === prenom.toLowerCase());
      if (exists) return;
      let dateNaissance = dateRaw;
      if (dateRaw.includes('/')) {
        const dp = dateRaw.split('/');
        if (dp.length === 3) dateNaissance = `${dp[2]}-${dp[1].padStart(2,'0')}-${dp[0].padStart(2,'0')}`;
      }
      batch.set(doc(C_LICENCIES), { lastname:nom, firstname:prenom, class:classe, sexe:sexeRaw.toUpperCase().charAt(0)||'G', dateNaissance, active:true });
      added++;
    });
    if (added > 0) { await batch.commit(); toast(`${added} licencié(s) importé(s) !`); setTimeout(window.openRoster, 400); }
    else toast('Aucun nouveau licencié.', 'info');
    e.target.value = '';
  };
  reader.readAsText(f, 'UTF-8');
};

/* --- CLICS & FORMULAIRES --- */
document.addEventListener('click', async ev => {
  const tab = ev.target.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; if (S.tab !== 'new') S.editId = null; render(); return; }

  const btn = ev.target.closest('[data-a]');
  if (btn) {
    const { a, id } = btn.dataset;
    if (a === 'open-detail') { S.detailId = id; render(); }
    if (a === 'close-detail') { S.detailId = null; render(); }
    if (a === 'toggle-lock') {
      const e = S.events.find(x => x.id === id);
      if (e) { await updateDoc(doc(C_EVENTS, id), { inscriptionsClosed: !e.inscriptionsClosed }); toast('Statut modifié'); }
    }
    if (a === 'delete-event') {
      if (confirm('Supprimer cet événement ?')) { await deleteDoc(doc(C_EVENTS, id)); toast('Supprimé'); }
    }
    if (a === 'edit-event') {
      const e = S.events.find(x => x.id === id);
      if (e) {
        S.editId = id; S.tab = 'new'; render();
        ['titre','date','heure','heurefin','lieu','lieuretour','places','link','desc'].forEach(k => {
          const el = document.getElementById('e-' + k);
          const map = { heurefin:'heureFin', lieuretour:'lieuRetour', link:'edunuageLink', desc:'description' };
          if (el) el.value = e[map[k] || k] || '';
        });
        const lk = document.getElementById('e-locked');
        if (lk) lk.value = e.inscriptionsClosed ? 'true' : 'false';
      }
    }
    if (a === 'register' || a === 'unregister') {
      const licId = S.profile?.licencieId;
      if (!licId) return;
      const docId = `${id}_${licId}`;
      if (a === 'register') await setDoc(doc(C_INSCRIPT, docId), { eventId:id, userId:licId, timestamp:Date.now() });
      else await deleteDoc(doc(C_INSCRIPT, docId));
    }
  }

  if (ev.target.closest('#btn-import-sheet')) {
    const btnSh = ev.target.closest('#btn-import-sheet');
    const url = document.getElementById('g-sheet-url').value.trim();
    const tabName = document.getElementById('g-sheet-tab').value.trim() || 'Calendrier 2026';
    if (!url) return toast('Lien invalide', 'error');
    localStorage.setItem('as_sheet_url', url);
    localStorage.setItem('as_sheet_tab', tabName);

    const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
    const gidMatch = url.match(/gid=([0-9]+)/);
    if (!match) return toast('Lien Google Sheets non reconnu', 'error');
    const sheetParam = gidMatch ? `&gid=${gidMatch[1]}` : `&sheet=${encodeURIComponent(tabName)}`;
    const apiUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/gviz/tq?tqx=out:json${sheetParam}`;

    btnSh.innerHTML = '<span class="spin"></span>';
    try {
      const res = await fetch(apiUrl);
      const text = await res.text();
      const sIdx = text.indexOf('{'), eIdx = text.lastIndexOf('}');
      if (sIdx === -1) throw new Error('Fichier non public');
      const data = JSON.parse(text.substring(sIdx, eIdx + 1));
      if (data.status === 'error') throw new Error(`Onglet "${tabName}" introuvable`);

      const getVal = (row, i) => String(row.c?.[i]?.f || row.c?.[i]?.v || '').trim();
      const parseDate = cell => {
        if (!cell) return '';
        const g = String(cell.v || '').match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)$/);
        if (g) return `${g[1]}-${String(+g[2]+1).padStart(2,'0')}-${String(g[3]).padStart(2,'0')}`;
        const m = String(cell.f || cell.v || '').match(/(\d{1,2})[-\s\/]+([a-zûéèêàç]+|\d{1,2})\.?[-\s\/]+(\d{2,4})/i);
        if (!m) return '';
        const map = { janv:'01',févr:'02',fevr:'02',mars:'03',avr:'04',avri:'04',mai:'05',juin:'06',juil:'07',août:'08',aout:'08',sept:'09',oct:'10',octo:'10',nov:'11',nove:'11',déc:'12',dec:'12' };
        const mois = map[m[2].toLowerCase().slice(0,4)] || (/^\d{1,2}$/.test(m[2]) ? m[2].padStart(2,'0') : '');
        return mois ? `${m[3].length===2?'20'+m[3]:m[3]}-${mois}-${m[1].padStart(2,'0')}` : '';
      };

      const batch = writeBatch(db);
      let added = 0;
      for (const row of (data.table?.rows || [])) {
        const date = parseDate(row.c?.[0]);
        if (!date) continue;
        const titres = [getVal(row, 1), getVal(row, 6)].filter(Boolean);
        const desc = [getVal(row, 4), getVal(row, 9)].filter(Boolean).join(' · ');
        const lieu = getVal(row, 10) || 'À définir';
        for (const titre of titres) {
          if (S.events.some(e => e.titre === titre && e.date === date)) continue;
          batch.set(doc(C_EVENTS), { titre, date, heure:'', heureFin:'', lieu, lieuRetour:'', description:desc, places:0, inscriptionsClosed:false, isPast:false, createdAt:Date.now() });
          added++;
        }
      }
      if (added > 0) { await batch.commit(); toast(`${added} événement(s) importé(s) !`); }
      else toast('Calendrier déjà à jour.', 'info');
    } catch (err) {
      toast(err.message || 'Erreur Google Sheets', 'error');
    } finally {
      btnSh.innerHTML = '🔄 Synchroniser le calendrier';
    }
  }
});

document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const form = ev.target;
  try {
    if (form.id === 'login-form') {
      const email = document.getElementById('l-email').value.trim();
      const pwd = document.getElementById('l-pwd').value;
      try {
        await signInWithEmailAndPassword(auth, email, pwd);
        toast('Connexion réussie !');
      } catch (err) {
        if (email.toLowerCase() === ADMIN_EMAIL) {
          regLock = true;
          const cred = await createUserWithEmailAndPassword(auth, email, pwd);
          await setDoc(doc(C_USERS, cred.user.uid), { prenom:'Professeur', nom:'EPS', role:'admin', email });
          regLock = false;
          toast('Compte admin initialisé !');
          location.reload();
        } else throw err;
      }
    }
    if (form.id === 'register-form') {
      const licId = document.getElementById('r-lic').value;
      const lic = S.licencies.find(l => l.id === licId);
      if (!lic) return toast('Sélectionne ton nom', 'error');
      const email = document.getElementById('r-email').value.trim();
      regLock = true;
      const cred = await createUserWithEmailAndPassword(auth, email, document.getElementById('r-pwd').value);
      await setDoc(doc(C_USERS, cred.user.uid), {
        prenom:lic.firstname, nom:lic.lastname, licencieId:licId,
        telResponsable:document.getElementById('r-tel').value.trim(), email, role:'eleve'
      });
      regLock = false;
      toast(`Bienvenue ${lic.firstname} !`);
      location.reload();
    }
    if (form.id === 'event-form') {
      const data = {
        titre:document.getElementById('e-titre').value.trim(),
        date:document.getElementById('e-date').value,
        heure:document.getElementById('e-heure').value,
        heureFin:document.getElementById('e-heurefin').value,
        lieu:document.getElementById('e-lieu').value.trim(),
        lieuRetour:document.getElementById('e-lieuretour').value,
        places:parseInt(document.getElementById('e-places').value, 10) || 0,
        inscriptionsClosed:document.getElementById('e-locked').value === 'true',
        edunuageLink:document.getElementById('e-link').value.trim(),
        description:document.getElementById('e-desc').value.trim()
      };
      if (S.editId) { await updateDoc(doc(C_EVENTS, S.editId), data); S.editId = null; toast('Événement modifié !'); }
      else { await addDoc(C_EVENTS, { ...data, isPast:false, createdAt:Date.now() }); toast('Événement ajouté !'); }
      form.reset(); S.tab = 'upcoming'; render();
    }
  } catch (err) {
    regLock = false;
    toast(err.code === 'auth/invalid-credential' ? 'Identifiants incorrects' : (err.message || 'Erreur'), 'error');
  }
});

window.checkCode = () => {
  if (document.getElementById('guard-input').value.trim().toUpperCase() === ACCESS_CODE) { S.view = 'register'; render(); }
  else toast('Code incorrect', 'error');
};
window.signOutAuth = () => signOut(auth);
window.S = S;
window.render = render;
</script>
</body>
