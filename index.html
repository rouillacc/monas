<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b2a6f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AS Collège Claudie Haigneré</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b2a6f'/%3E%3Ccircle cx='50' cy='50' r='26' fill='%23ff7a1a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>
/* --- DESIGN SYSTEM PREMIUM --- */
:root{
  --navy:#0b2a6f; --navy-2:#143d9e; --blue:#2563eb; --orange:#ff7a1a; --orange-2:#ff9a4d;
  --green:#16a34a; --red:#dc2626; --bg:#f4f7fb; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --radius:24px; --shadow:0 10px 25px rgba(15,35,95,.06); --shadow-sm:0 4px 12px rgba(15,35,95,.04);
  --nav-h:72px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden; display:flex;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

#shell{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:var(--bg); position:relative;overflow:hidden;box-shadow:0 0 60px rgba(15,35,95,.15)}

header{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 20px 20px; border-radius:0 0 32px 32px;box-shadow:0 12px 30px rgba(11,42,111,.35);z-index:10;flex-shrink:0; display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.15);display:grid;place-items:center; font-size:28px;color:var(--orange-2);backdrop-filter:blur(10px)}
.brand h1{font-size:16px;font-weight:800;line-height:1.2;letter-spacing:.03em;text-transform:uppercase}
.brand h1 span{color:#bcd0ff;font-weight:600}
.icon-btn{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;font-size:22px; display:grid;place-items:center;position:relative;overflow:hidden;transition:.2s}
.icon-btn:active{transform:scale(0.92)}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px 16px calc(var(--nav-h) + 28px);scroll-behavior:smooth}
main.no-nav{padding-bottom:28px}
main::-webkit-scrollbar{width:0}

.screen{animation:slideIn .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.stagger>*{animation:slideIn .4s cubic-bezier(.2,.8,.2,1) both}
.stagger>*:nth-child(2){animation-delay:.08s}.stagger>*:nth-child(3){animation-delay:.16s}

.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px;position:relative;overflow:hidden; border:1px solid rgba(255,255,255,0.6);}
.card.past{background:#f8fafc; opacity:0.9;}
.card-flex{display:flex; gap:16px; align-items:flex-start;}

.event-thumb { width: 58px; height: 58px; border-radius: 18px; flex-shrink: 0; display: grid; place-items: center; font-size: 30px; color: white; box-shadow: 0 6px 14px rgba(0,0,0,0.12); }

.event-info { flex: 1; min-width: 0; }
.badge{display:inline-flex;align-items:center;gap:6px;background:#e8efff;color:var(--blue);font-size:12px;font-weight:800; padding:6px 12px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em; margin-bottom:8px;}
.badge.gray{background:#e2e8f0;color:#475569}
.card h3{font-size:19px;font-weight:800;margin:0 0 8px;line-height:1.25; color:var(--text);}
.meta{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13px;font-weight:600}
.desc{margin-top:14px;background:#f8fafc;border-radius:14px;padding:12px 14px;font-size:14px;color:#334155;line-height:1.5; border:1px solid var(--line);}
.registered-stripe{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--green)}

.btn{width:100%;padding:16px;border-radius:16px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px; position:relative;overflow:hidden;transition:all .2s cubic-bezier(0.2,0.8,0.2,1); cursor:pointer;}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--navy-2));color:#fff; box-shadow:0 8px 20px rgba(37,99,235,0.25);}
.btn-orange{background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff; box-shadow:0 8px 20px rgba(255,122,26,0.25);}
.btn-success{background:#dcfce7;color:#15803d;border:2px solid #22c55e;}
.btn-ghost{background:#eef2fb;color:var(--navy-2)}
.btn-danger{background:#fee2e2;color:var(--red)}
.icon-action{background:#f1f5f9; color:var(--muted); width:36px; height:36px; border-radius:12px; display:grid; place-items:center; font-size:18px;}

.form-card{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow); margin-bottom:20px;}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 8px 4px;text-transform:uppercase; letter-spacing:0.03em;}
.input{width:100%;background:#f8fafc;border:2px solid #e2e8f0;border-radius:16px;padding:14px 16px;font-size:16px; transition:0.2s; color:var(--text); font-weight:500;}
.input:focus{outline:none;background:#fff;border-color:var(--blue); box-shadow:0 0 0 4px rgba(37,99,235,0.1);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg input{display:none}
.seg label{margin:0;text-align:center;padding:14px;border-radius:14px;background:#f8fafc;font-size:15px;font-weight:800;color:var(--muted); cursor:pointer; border:2px solid #e2e8f0; transition:0.2s;}
.seg input:checked+label{background:#e8efff;color:var(--blue); border-color:var(--blue);}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:30px}
.hero-icon{width:100px;height:100px;border-radius:32px;background:linear-gradient(135deg,#e8efff,#fff);display:grid;place-items:center; font-size:48px;color:var(--blue);box-shadow:var(--shadow);margin-bottom:24px;}
.hero h2{font-size:28px;font-weight:800;margin-bottom:10px; color:var(--navy);}
.code-input{text-align:center;font-weight:800;font-size:22px;letter-spacing:.15em; text-transform:uppercase;}
.link{color:var(--blue);font-weight:800;font-size:14px;padding:12px; display:inline-block;}

nav{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);height:var(--nav-h);background:#fff;border-radius:28px; box-shadow:0 10px 40px rgba(11,42,111,.15);display:flex;padding:8px;z-index:20; border:1px solid rgba(255,255,255,0.8);}
nav button{flex:1;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px; font-weight:800;color:var(--muted);transition:all .3s cubic-bezier(0.2,0.8,0.2,1);}
nav button.active{background:linear-gradient(135deg,#e8efff,#f3f7ff);color:var(--blue); transform:translateY(-2px);}
nav button.active i{transform:scale(1.15)}

.profile{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px; background:#fff; padding:16px; border-radius:24px; box-shadow:var(--shadow-sm);}
.profile h2{font-size:20px;font-weight:800; color:var(--navy);}
.avatar{width:54px;height:54px;border-radius:20px;background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px; box-shadow:0 6px 15px rgba(255,122,26,0.3);}
.section-title{font-size:20px;font-weight:800;margin:10px 4px 16px;display:flex;align-items:center;gap:10px; color:var(--navy);}
.empty{text-align:center;color:var(--muted);padding:40px 20px;background:rgba(255,255,255,.5);border:2px dashed #cbd5e1;border-radius:var(--radius);font-weight:600; font-size:15px;}

.admin-banner{background:linear-gradient(135deg,#fff1e4,#ffe2c8);color:#b34700;border-radius:20px;padding:14px 18px;font-weight:800;font-size:15px; display:flex;align-items:center;gap:12px;margin-bottom:20px; border:1px solid rgba(255,122,26,0.2);}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:24px}
.stat{background:#fff;border-radius:20px;padding:18px 12px;text-align:center;box-shadow:var(--shadow-sm); border:1px solid #f1f5f9;}
.stat b{display:block;font-size:28px;font-weight:800;color:var(--blue); margin-bottom:4px;}
.stat span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase; letter-spacing:0.05em;}
.inscrits-chip{display:flex;justify-content:space-between;align-items:center;background:#eef3ff;border-radius:16px;padding:14px 16px;margin-top:16px; font-weight:800;color:var(--navy);cursor:pointer; transition:0.2s;}
.inscrits-chip:active{background:#e0e7ff; transform:scale(0.98);}

#appel-overlay { position: fixed; inset: 0; z-index: 9999; background: #f4f7fb; display: none; flex-direction: column; animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
.appel-header { background: var(--navy); color: #fff; padding: calc(env(safe-area-inset-top) + 16px) 20px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.25); z-index: 10; }
.btn-close-appel { background: #ef4444; color: #fff; font-weight: 800; font-size: 14px; padding: 10px 18px; border-radius: 14px; display: flex; align-items: center; gap: 8px; box-shadow:0 4px 12px rgba(239,68,68,0.3); }
#appel-frame { flex: 1; width: 100%; border: none; background: #fff; }

#toasts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 80px);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:100;pointer-events:none}
.toast{background:#0f172a;color:#fff;padding:14px 20px;border-radius:18px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:12px; max-width:90%; box-shadow:0 10px 25px rgba(0,0,0,0.2);}
.toast.out{opacity:0; transform:translateY(-10px); transition:0.3s;}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;display:inline-block;}
@keyframes rot{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>

<body>
<div id="shell">
  <header>
    <div class="brand">
      <div class="brand-logo"><i class="ph-fill ph-person-simple-run"></i></div>
      <h1>AS Claudie<br><span>Haigneré</span></h1>
    </div>
    <div id="header-actions"></div>
  </header>

  <main id="view"></main>
  <nav id="nav" class="hidden"></nav>
  <div id="toasts"></div>
  
  <!-- BANDEAU D'INSTALLATION PWA -->
  <div id="install-banner" style="display:none; position:fixed; top:20px; left:16px; right:16px; background:var(--navy); color:#fff; padding:16px; border-radius:24px; box-shadow:0 12px 30px rgba(11,42,111,0.4); z-index:9999; flex-direction:column; gap:14px; animation:slideIn 0.4s;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div style="display:flex; gap:12px; align-items:center;">
              <div style="width:42px; height:42px; background:linear-gradient(135deg, var(--orange), var(--orange-2)); border-radius:14px; display:grid; place-items:center; font-size:22px; box-shadow:0 4px 10px rgba(255,122,26,0.3);">📲</div>
              <div>
                  <b style="font-size:16px; display:block; line-height:1.2;">Installer l'application</b>
                  <span style="font-size:12px; color:#c5d6ff; font-weight:600;">Accès direct depuis votre écran</span>
              </div>
          </div>
          <button onclick="closeInstallBanner()" style="color:#fff; background:rgba(255,255,255,0.15); width:32px; height:32px; border-radius:50%; display:grid; place-items:center; transition:0.2s;"><i class="ph-bold ph-x"></i></button>
      </div>
      <button id="install-btn" onclick="triggerInstall()" class="btn" style="background:#fff; color:var(--navy); padding:12px; font-size:14px; box-shadow:none;">Installer maintenant</button>
  </div>
</div>

<div id="appel-overlay">
    <div class="appel-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:36px;height:36px;background:rgba(255,255,255,0.2);border-radius:10px;display:grid;place-items:center;color:var(--orange-2);font-size:20px;">
                <i class="ph-fill ph-clipboard-text"></i>
            </div>
            <span style="font-weight:800; font-size:18px; letter-spacing:0.02em;">Appel UNSS</span>
        </div>
        <button class="btn-close-appel" onclick="closeAppelMode()">
            <i class="ph-bold ph-x"></i> Quitter
        </button>
    </div>
    <iframe id="appel-frame" src="https://rouillacc.github.io/appel/"></iframe>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, setDoc, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB475MQ5DD_xXZlVHKDbcrPcciLSr7FGto",
  authDomain: "cdm-rouillac.firebaseapp.com",
  projectId: "cdm-rouillac",
  storageBucket: "cdm-rouillac.firebasestorage.app",
  messagingSenderId: "650773834321",
  appId: "1:650773834321:web:a9c5a348f65fcf46b82670"
};
const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

const ADMIN_EMAIL = 'epsclaudie@gmail.com';
const ACCESS_CODE = 'Rouillac16';
const col  = (name) => collection(db, 'artifacts', 'as-claudie-haignere', 'public', 'data', name);
const dref = (name, id) => doc(db, 'artifacts', 'as-claudie-haignere', 'public', 'data', name, id);

const S = {
  view: 'loading', tab: 'upcoming', user: null, profile: null, isAdmin: false,
  events: [], inscriptions: [], users: [], unsubs: [], detailId: null, editId: null
};

const $view = document.getElementById('view');
const $nav = document.getElementById('nav');
const $head = document.getElementById('header-actions'); 

const getTodayString = () => {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().split('T')[0];
};

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (d) => {
    let dateObj = d.includes('/') ? new Date(`${d.split('/')[2]}-${d.split('/')[1]}-${d.split('/')[0]}T00:00:00`) : new Date(d + 'T00:00:00');
    return isNaN(dateObj) ? d : dateObj.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
};
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const countFor = (id) => S.inscriptions.filter(i => i.eventId === id).length;

const upcomingEvents = () => {
    const today = getTodayString();
    return S.events.filter(e => e.date >= today && !e.isPast).sort((a,b) => a.date.localeCompare(b.date));
};
const pastEvents = () => {
    const today = getTodayString();
    return S.events.filter(e => e.date < today || e.isPast).sort((a,b) => b.date.localeCompare(a.date));
};
const galleryEvents = () => pastEvents().filter(e => e.edunuageLink && e.edunuageLink.trim() !== '');

function getEventTheme(titre, desc = '') {
    const text = (titre + ' ' + desc).toLowerCase();
    if (text.includes('futsal') || text.includes('foot')) return { emoji: '⚽', color: 'linear-gradient(135deg, #10b981, #059669)' };
    if (text.includes('basket')) return { emoji: '🏀', color: 'linear-gradient(135deg, #f97316, #ea580c)' };
    if (text.includes('hand')) return { emoji: '🤾', color: 'linear-gradient(135deg, #0ea5e9, #0284c7)' };
    if (text.includes('cross') || text.includes('athlé') || text.includes('run') || text.includes('course')) return { emoji: '🏃', color: 'linear-gradient(135deg, #ef4444, #dc2626)' };
    if (text.includes('bad') || text.includes('raquette') || text.includes('tennis')) return { emoji: '🏸', color: 'linear-gradient(135deg, #8b5cf6, #7c3aed)' };
    if (text.includes('swim') || text.includes('natation') || text.includes('sirène')) return { emoji: '🏊', color: 'linear-gradient(135deg, #06b6d4, #0891b2)' };
    if (text.includes('escalade') || text.includes('grimp')) return { emoji: '🧗', color: 'linear-gradient(135deg, #64748b, #475569)' };
    if (text.includes('c.o') || text.includes('orientation') || text.includes('raid') || text.includes('bouchaud')) return { emoji: '🧭', color: 'linear-gradient(135deg, #84cc16, #65a30d)' };
    if (text.includes('vtt') || text.includes('bike')) return { emoji: '🚵', color: 'linear-gradient(135deg, #f59e0b, #d97706)' };
    if (text.includes('volley') || text.includes('beach')) return { emoji: '🏐', color: 'linear-gradient(135deg, #eab308, #ca8a04)' };
    if (text.includes('flag') || text.includes('ultimate')) return { emoji: '🥏', color: 'linear-gradient(135deg, #14b8a6, #0d9488)' };
    if (text.includes('gym')) return { emoji: '🤸', color: 'linear-gradient(135deg, #d946ef, #c026d3)' };
    return { emoji: '🏆', color: 'linear-gradient(135deg, var(--blue), var(--navy-2))' };
}

window.toast = function(msg, type = 'success') {
  const icons = { success:'ph-check-circle', error:'ph-warning-circle', info:'ph-info' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<i class="ph-fill ${icons[type]}"></i><span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2800);
}

window.closeAppelMode = function() { document.getElementById('appel-overlay').style.display = 'none'; }
window.openAppelMode = function() { document.getElementById('appel-overlay').style.display = 'flex'; }

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    S.unsubs.forEach(u => u()); S.unsubs = [];
    Object.assign(S, { user:null, profile:null, isAdmin:false, tab:'upcoming', view:'guard' });
    try { render(); } catch(e) {}
    return;
  }
  S.user = user;
  S.isAdmin = (user.email || '').toLowerCase() === ADMIN_EMAIL;
  if (S.isAdmin) {
      S.profile = { role:'admin', prenom:'Admin', nom:'EPS' };
  } else {
      const snap = await getDoc(dref('utilisateurs', user.uid));
      S.profile = snap.data();
  }
  S.view = S.isAdmin ? 'admin' : 'student';
  S.unsubs.push(onSnapshot(col('evenements'), s => { S.events = s.docs.map(d => ({id:d.id, ...d.data()})); try{render()}catch(e){} }));
  S.unsubs.push(onSnapshot(col('inscriptions'), s => { S.inscriptions = s.docs.map(d => ({id:d.id, ...d.data()})); try{render()}catch(e){} }));
  if(S.isAdmin) S.unsubs.push(onSnapshot(col('utilisateurs'), s => { S.users = s.docs.map(d => ({id:d.id, ...d.data()})); try{render()}catch(e){} }));
  try{render()}catch(e){}
});

function render() {
  const scroll = $view.scrollTop;
  $head.innerHTML = S.user ? `<button class="icon-btn" onclick="signOutAuth()" aria-label="Déconnexion"><i class="ph-bold ph-sign-out"></i></button>` : '';

  if(S.view === 'guard') $view.innerHTML = `<div class="hero"><div class="hero-icon"><i class="ph-fill ph-lock-key"></i></div><h2>Accès Collège</h2><p style="color:var(--muted); font-weight:600; margin-bottom:24px;">Entre le code de l'AS fourni par les professeurs.</p><div style="width:100%;max-width:300px"><input id="guard-input" class="input code-input" placeholder="CODE"><button class="btn btn-primary" onclick="checkCode()" style="margin-top:16px">Valider l'accès</button><button class="link" onclick="showLogin()" style="margin-top:16px;width:100%">J'ai déjà un compte · Connexion</button></div></div>`;
  
  if(S.view === 'login') $view.innerHTML = `<div class="hero" style="padding-top:8px"><div class="form-card" style="width:100%"><h2 style="font-size:24px;font-weight:800;margin-bottom:24px;text-align:left;color:var(--navy);"><i class="ph-fill ph-sign-in" style="color:var(--blue); vertical-align:-3px;"></i> Connexion</h2><form id="login-form" style="text-align:left"><div class="field"><label>Email</label><input class="input" id="l-email" type="email" required></div><div class="field"><label>Mot de passe</label><input class="input" id="l-pwd" type="password" required></div><button class="btn btn-primary" type="submit" style="margin-top:24px;">Se connecter</button></form><button class="link" onclick="showGuard()" style="margin-top:16px"><i class="ph-bold ph-arrow-left"></i> Retour</button></div></div>`;

document.addEventListener('click', async (ev) => {
  const tabBtn = ev.target.closest('[data-tab]');
  if(tabBtn) {
      if(tabBtn.dataset.tab === 'appel') { openAppelMode(); } 
      else { 
          S.tab = tabBtn.dataset.tab; 
          if(S.tab !== 'new') S.editId = null;
          try{render()}catch(e){} 
      }
  }
  
  const btn = ev.target.closest('[data-a]');
  if(btn) {
      const a = btn.dataset.a, id = btn.dataset.id;
      if(a === 'close-detail') { S.detailId = null; try{render()}catch(e){} }
      if(a === 'open-detail') { S.detailId = id; try{render()}catch(e){} }
      
      if(a === 'edit-event') {
          const evtToEdit = S.events.find(x => x.id === id);
          if (evtToEdit) {
              S.editId = id;
              S.tab = 'new';
              try{render()}catch(e){}
              
              setTimeout(() => {
                  if(document.getElementById('e-titre')) document.getElementById('e-titre').value = evtToEdit.titre || '';
                  if(document.getElementById('e-date')) document.getElementById('e-date').value = evtToEdit.date || '';
                  if(document.getElementById('e-heure')) document.getElementById('e-heure').value = evtToEdit.heure || '';
                  if(document.getElementById('e-lieu')) document.getElementById('e-lieu').value = evtToEdit.lieu || '';
                  if(document.getElementById('e-desc')) document.getElementById('e-desc').value = evtToEdit.description || '';
                  if(document.getElementById('e-link')) document.getElementById('e-link').value = evtToEdit.edunuageLink || '';
              }, 50);
          }
      }
      
      if(a === 'register' || a === 'unregister') {
          btn.innerHTML = '<span class="spin"></span>';
          const docId = `${id}_${S.user.uid}`;
          if (a === 'register') await setDoc(dref('inscriptions', docId), { eventId:id, userId:S.user.uid, timestamp:Date.now() });
          else await deleteDoc(dref('inscriptions', docId));
      }
      if(a === 'delete-event') {
          if (confirm("Supprimer définitivement cet événement ?")) {
              await deleteDoc(dref('evenements', id));
              S.detailId = null; toast('Supprimé avec succès');
          }
      }
      if(a === 'toggle-past') {
          const e = S.events.find(x => x.id === id);
          if(e) { await updateDoc(dref('evenements', id), { isPast: !e.isPast }); toast('Statut modifié'); S.detailId=null; try{render()}catch(e){} }
      }
  }
  
  if(ev.target.closest('#btn-import-sheet')) {
      const btnSh = ev.target.closest('#btn-import-sheet');
      const url = document.getElementById('g-sheet-url').value.trim();
      if(!url) return toast('Lien invalide', 'error');
      localStorage.setItem('as_sheet_url', url);
      
      const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
      const gidMatch = url.match(/gid=([0-9]+)/);
      if(!match) return toast('Format de lien Google Sheet non reconnu.', 'error');
      
      const apiUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/gviz/tq?tqx=out:json&gid=${gidMatch ? gidMatch[1] : '0'}`;
      
      btnSh.innerHTML = '<span class="spin"></span>';
      try {
          const res = await fetch(apiUrl);
          if(!res.ok) throw new Error("Fichier inaccessible. Est-il bien partagé ?");
          const text = await res.text();
          
          const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
          const data = JSON.parse(jsonStr);
          
          const batch = writeBatch(db);
          let added = 0;
          
          if (data.table && data.table.rows) {
              for(let row of data.table.rows) {
                  if (!row.c || !row.c[0]) continue;
                  
                  const dateBrute = String(row.c[0].f || row.c[0].v || '').trim();
                  const titre = String(row.c[1]?.f || row.c[1]?.v || '').trim();
                  if (!titre) continue;
                  
                  const theme = String(row.c[2]?.f || row.c[2]?.v || '').trim();
                  
                  let extras = [];
                  for (let i = 3; i < row.c.length; i++) {
                      if (row.c[i] && row.c[i].v !== null) {
                          let val = String(row.c[i].f || row.c[i].v).trim();
                          if (val && val !== 'OUI' && val !== 'O' && val !== 'N') extras.push(val);
                      }
                  }
                  const lieu = extras.length > 0 ? extras.join(' - ') : 'À définir';
                  
                  const dateMatch = dateBrute.match(/^(\d{1,2})[-\s]([a-zûé]+)\.?([-\s]?)(\d{2,4})$/i);
                  
                  if(dateMatch) {
                      const jour = dateMatch[1].padStart(2, '0');
                      const moisBrut = dateMatch[2].toLowerCase();
                      const anneeBrute = dateMatch[4];
                      const annee = anneeBrute.length === 2 ? "20" + anneeBrute : anneeBrute;
                      
                      const mapMois = { 'janv':'01', 'févr':'02', 'fevr':'02', 'mars':'03', 'avr':'04', 'mai':'05', 'juin':'06', 'juil':'07', 'août':'08', 'aout':'08', 'sept':'09', 'oct':'10', 'nov':'11', 'déc':'12', 'dec':'12' };
                      const mois = mapMois[moisBrut] || '01';
                      const dateFormatee = `${annee}-${mois}-${jour}`;
                      
                      const exists = S.events.some(e => e.titre === titre && e.date === dateFormatee);
                      if(!exists) {
                          const newDoc = doc(col('evenements'));
                          batch.set(newDoc, {
                              titre: titre,
                              date: dateFormatee,
                              heure: '',
                              lieu: lieu,
                              description: theme,
                              places: 0,
                              isPast: false,
                              createdAt: Date.now()
                          });
                          added++;
                      }
                  }
              }
          }
          if(added > 0) { await batch.commit(); toast(`${added} événements synchronisés !`); } 
          else { toast(`Calendrier déjà à jour.`, 'info'); }
      } catch(err) {
          console.error(err);
          toast("Erreur : impossible de lire le tableau", 'error');
      } finally {
          btnSh.innerHTML = '<i class="ph-bold ph-arrows-clockwise"></i> Mettre à jour le calendrier';
      }
  }
});

        titre: document.getElementById('e-titre').value.trim(), 
        date: document.getElementById('e-date').value,
        heure: document.getElementById('e-heure').value, 
        lieu: document.getElementById('e-lieu').value.trim(),
        description: document.getElementById('e-desc').value.trim(), 
        edunuageLink: document.getElementById('e-link') ? document.getElementById('e-link').value.trim() : ''
      };

      if (S.editId) {
          await updateDoc(dref('evenements', S.editId), eventData);
          toast('Événement modifié !');
          S.editId = null;
      } else {
          eventData.places = 0; 
          eventData.isPast = false; 
          eventData.createdAt = Date.now();
          await addDoc(col('evenements'), eventData);
          toast('Événement ajouté !');
      }
      
      form.reset(); 
      S.tab = 'upcoming'; 
      try{render()}catch(e){}
    }
  } catch (err) {
    btn.innerHTML = initialBtnHTML;
    toast(err.code === 'auth/invalid-credential' ? 'Identifiants incorrects' : 'Une erreur est survenue', 'error');
  }
});

window.showLogin = () => { S.view = 'login'; try { render(); } catch(e) {} };
window.showGuard = () => { S.view = 'guard'; try { render(); } catch(e) {} };
window.checkCode = () => {
    const val = document.getElementById('guard-input').value.trim();
    if(val === ACCESS_CODE) { S.view = 'register'; try{render()}catch(e){} toast('Code validé !'); }
    else { toast('Code d\'accès incorrect', 'error'); }
};

window.signOutAuth = async () => { await signOut(auth); toast('À bientôt !', 'info'); }

// --- SYSTÈME D'INSTALLATION PWA (1ère visite uniquement) ---
const INSTALL_KEY = 'as_haignere_installed_v1';
let deferredPrompt;

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW erreur:', err));
    });
}

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    checkAndShowBanner();
});

function checkAndShowBanner() {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    const hasSeenPrompt = localStorage.getItem(INSTALL_KEY);
    
    if (!isStandalone && !hasSeenPrompt) {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const banner = document.getElementById('install-banner');
        const btn = document.getElementById('install-btn');
        
        if (isIOS) {
            btn.innerHTML = 'Faites "Partager" <i class="ph-bold ph-export" style="font-size:18px;"></i> puis "Sur l\'écran d\'accueil" <i class="ph-bold ph-plus-square" style="font-size:18px;"></i>';
            btn.style.background = "#f4f7fb";
            btn.onclick = () => { closeInstallBanner(); }; 
        }
        banner.style.display = 'flex';
    }
}

setTimeout(checkAndShowBanner, 2000);

window.triggerInstall = async () => {
    closeInstallBanner();
    if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
    }
};

window.closeInstallBanner = () => {
    localStorage.setItem(INSTALL_KEY, 'true');
    document.getElementById('install-banner').style.display = 'none';
};

try { render(); } catch (error) {
    console.error("Erreur de démarrage AS :", error);
    $view.innerHTML = `<div class="empty"><h3>Oups !</h3><p>Recharge la page ou contacte le professeur.</p></div>`;
}
</script>
</body>
</html>
