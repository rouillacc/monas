<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS Collège Claudie Haigneré</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; /* slate-100 */
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom form focus rings */
        input:focus, select:focus, textarea:focus {
            outline: none;
            box-shadow: 0 0 0 2px #3b82f6;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-900 to-blue-800 text-white z-50 shadow-lg shrink-0">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2 rounded-xl backdrop-blur-sm">
                    <i class="ph-fill ph-person-simple-run text-orange-400 text-2xl"></i>
                </div>
                <h1 class="font-bold text-lg leading-tight tracking-wide uppercase">AS Claudie<br><span class="text-blue-200">Haigneré</span></h1>
            </div>
            <div id="header-actions">
                <!-- Dynamically populated based on state -->
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app" class="flex-1 overflow-y-auto w-full max-w-md mx-auto relative bg-slate-50 shadow-xl shadow-slate-200/50">
        <div id="app-content" class="min-h-full p-4 pb-20">
            <!-- Loading State -->
            <div class="flex flex-col items-center justify-center h-full text-slate-400 pt-20">
                <i class="ph ph-spinner-gap animate-spin text-4xl mb-3 text-blue-500"></i>
                <p class="font-medium">Échauffement en cours...</p>
            </div>
        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0 z-50 flex items-center gap-2 max-w-[90%] w-max">
        <i id="toast-icon" class="ph-fill ph-info text-xl"></i>
        <span id="toast-msg" class="text-sm font-medium"></span>
    </div>

    <!-- Firebase Logic & App State -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment Setup (Compatible with standard Firebase or immersive environment)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'as-claudie-haignere';
        const firebaseConfig = {
            apiKey: "AIzaSyB475MQ5DD_xXZlVHKDbcrPcciLSr7FGto",
            authDomain: "cdm-rouillac.firebaseapp.com",
            projectId: "cdm-rouillac",
            storageBucket: "cdm-rouillac.firebasestorage.app",
            messagingSenderId: "650773834321",
            appId: "1:650773834321:web:a9c5a348f65fcf46b82670"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Helper for strict paths (Rule 1)
        const getCollectionRef = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
        const getDocRef = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, docId);

        // State Management
        let state = {
            view: 'LOADING', // LOADING, GUARD, REGISTER, LOGIN, STUDENT, ADMIN
            user: null,
            profile: null,
            events: [],
            inscriptions: [],
            allUsers: [], // Only fetched if Admin
            unsubscribes: []
        };

        const domApp = document.getElementById('app-content');
        const headerActions = document.getElementById('header-actions');

        // --- CORE LOGIC ---

        // Listen for authentication changes
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                state.user = user;
                
                // Admin hardcoded check
                if (user.email === 'epsclaudie@gmail.com') {
                    state.profile = { role: 'admin', prenom: 'Admin', nom: 'EPS' };
                    state.view = 'ADMIN';
                } else {
                    // Fetch student profile
                    try {
                        let profileSnap = await getDoc(getDocRef('utilisateurs', user.uid));
                        if (!profileSnap.exists()) {
                            // Slight delay in case register is writing it right now
                            await new Promise(r => setTimeout(r, 1000));
                            profileSnap = await getDoc(getDocRef('utilisateurs', user.uid));
                        }
                        if (profileSnap.exists()) {
                            state.profile = profileSnap.data();
                        } else {
                            // Should not happen unless db corrupted, force logout
                            await signOut(auth);
                            return;
                        }
                    } catch(e) {
                        console.error(e);
                        showToast("Erreur de profil", "error");
                    }
                    state.view = 'STUDENT';
                }
                
                startDataListeners();
            } else {
                state.user = null;
                state.profile = null;
                state.view = 'GUARD';
                stopDataListeners();
            }
            render();
        });

        function startDataListeners() {
            stopDataListeners(); // clear existing
            
            // 1. Listen to events
            const unsubEvents = onSnapshot(getCollectionRef('evenements'), (snapshot) => {
                state.events = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            }, (error) => console.error("Events error", error));
            state.unsubscribes.push(unsubEvents);

            // 2. Listen to inscriptions
            const unsubInscriptions = onSnapshot(getCollectionRef('inscriptions'), (snapshot) => {
                state.inscriptions = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            }, (error) => console.error("Inscriptions error", error));
            state.unsubscribes.push(unsubInscriptions);

            // 3. If Admin, listen to all users
            if (state.profile?.role === 'admin') {
                const unsubUsers = onSnapshot(getCollectionRef('utilisateurs'), (snapshot) => {
                    state.allUsers = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    render();
                }, (error) => console.error("Users error", error));
                state.unsubscribes.push(unsubUsers);
            }
        }

        function stopDataListeners() {
            state.unsubscribes.forEach(unsub => unsub());
            state.unsubscribes = [];
            state.events = [];
            state.inscriptions = [];
            state.allUsers = [];
        }

        // --- RENDER FUNCTIONS ---

        function render() {
            // Update Header actions
            if (state.user) {
                headerActions.innerHTML = `
                    <button data-action="logout" class="bg-blue-950/50 hover:bg-blue-950 px-3 py-1.5 rounded-lg text-sm font-semibold text-blue-100 transition border border-blue-800/50 flex items-center gap-2">
                        <i class="ph ph-sign-out"></i> Quitter
                    </button>
                `;
            } else {
                headerActions.innerHTML = '';
            }

            // Render main view
            if (state.view === 'LOADING') return;

            if (state.view === 'GUARD') domApp.innerHTML = renderGuard();
            else if (state.view === 'LOGIN') domApp.innerHTML = renderLogin();
            else if (state.view === 'REGISTER') domApp.innerHTML = renderRegister();
            else if (state.view === 'STUDENT') domApp.innerHTML = renderStudentDashboard();
            else if (state.view === 'ADMIN') domApp.innerHTML = renderAdminDashboard();
        }

        function renderGuard() {
            return `
                <div class="flex flex-col items-center justify-center h-full px-4 pt-10 fade-in">
                    <div class="bg-blue-100 w-20 h-20 rounded-full flex items-center justify-center mb-6">
                        <i class="ph-fill ph-lock-key text-4xl text-blue-600"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-2 text-slate-800 text-center">Accès Collège</h2>
                    <p class="text-slate-500 text-center mb-8 text-sm">Entrez le code fourni par vos professeurs d'EPS pour créer votre compte.</p>
                    
                    <div class="w-full max-w-xs space-y-4">
                        <input type="text" id="guard-input" placeholder="Code d'accès" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-center font-bold text-lg text-slate-800 tracking-wider">
                        <button data-action="check-guard" class="w-full bg-blue-600 text-white font-bold rounded-xl px-4 py-3 hover:bg-blue-700 transition shadow-lg shadow-blue-600/30 flex justify-center items-center gap-2">
                            Valider <i class="ph-bold ph-arrow-right"></i>
                        </button>
                        <div class="text-center pt-4">
                            <button data-action="go-login" class="text-sm text-blue-600 font-semibold hover:underline">J'ai déjà un compte (Connexion)</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLogin() {
            return `
                <div class="flex flex-col items-center justify-center h-full px-4 pt-4 fade-in">
                    <div class="w-full max-w-xs bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <h2 class="text-xl font-bold mb-6 text-slate-800 flex items-center gap-2">
                            <i class="ph-fill ph-sign-in text-blue-500"></i> Connexion
                        </h2>
                        <form id="login-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">Email (Identifiant)</label>
                                <input type="email" id="login-email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">Mot de passe</label>
                                <input type="password" id="login-password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm">
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white font-bold rounded-xl px-4 py-3 hover:bg-blue-700 transition mt-2 shadow-md shadow-blue-600/20">
                                Se connecter
                            </button>
                        </form>
                        <div class="text-center pt-6">
                            <button data-action="go-guard" class="text-sm text-slate-500 font-medium hover:text-blue-600"><i class="ph ph-arrow-left"></i> Retour au code d'accès</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRegister() {
            return `
                <div class="px-2 pt-2 fade-in pb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <div class="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                            <div class="bg-green-100 p-2 rounded-lg"><i class="ph-bold ph-check text-green-600 text-xl"></i></div>
                            <div>
                                <h2 class="text-xl font-bold text-slate-800">Inscription validée</h2>
                                <p class="text-xs text-slate-500">Code correct. Crée ton profil.</p>
                            </div>
                        </div>

                        <form id="register-form" class="space-y-4">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">Prénom</label>
                                    <input type="text" id="reg-prenom" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">Nom</label>
                                    <input type="text" id="reg-nom" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">Sexe</label>
                                    <div class="flex gap-4 px-1 py-2">
                                        <label class="flex items-center gap-1 text-sm font-medium"><input type="radio" name="sexe" value="F" required> F</label>
                                        <label class="flex items-center gap-1 text-sm font-medium"><input type="radio" name="sexe" value="G" required> G</label>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">Classe</label>
                                    <select id="reg-classe" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm bg-white">
                                        <option value="">Choisir...</option>
                                        <option value="6e">6ème</option>
                                        <option value="5e">5ème</option>
                                        <option value="4e">4ème</option>
                                        <option value="3e">3ème</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">Tél. Responsable Légal</label>
                                <input type="tel" id="reg-tel" required placeholder="06..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                            </div>

                            <div class="border-t border-slate-100 pt-4 mt-2">
                                <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">Email (Servira d'identifiant)</label>
                                <input type="email" id="reg-email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm mb-3">
                                
                                <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">Mot de passe (6 car. min)</label>
                                <input type="password" id="reg-password" required minlength="6" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                            </div>

                            <button type="submit" id="btn-register-submit" class="w-full bg-orange-500 text-white font-bold rounded-xl px-4 py-3 hover:bg-orange-600 transition mt-4 shadow-lg shadow-orange-500/30 flex justify-center items-center">
                                Créer mon compte
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderStudentDashboard() {
            const upcoming = state.events.filter(e => !e.isPast).sort((a, b) => a.date.localeCompare(b.date));
            const past = state.events.filter(e => e.isPast).sort((a, b) => b.date.localeCompare(a.date));

            return `
                <div class="fade-in">
                    <div class="mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Licencié(e)</p>
                            <h2 class="text-xl font-bold text-slate-800">${state.profile?.prenom} ${state.profile?.nom} <span class="text-slate-400 font-medium text-sm ml-1">(${state.profile?.classe})</span></h2>
                        </div>
                        <div class="bg-blue-50 text-blue-600 p-3 rounded-full">
                            <i class="ph-fill ph-user text-2xl"></i>
                        </div>
                    </div>

                    <h3 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2 px-1">
                        <i class="ph-fill ph-calendar-check text-blue-600"></i> À venir
                    </h3>
                    ${upcoming.length === 0 
                        ? `<div class="bg-white/50 border border-slate-200 rounded-xl p-6 text-center text-slate-500 mb-8"><i class="ph ph-barbell text-3xl mb-2 text-slate-300"></i><br>Aucune compétition prévue pour le moment.</div>` 
                        : `<div class="flex flex-col gap-3 mb-8">${upcoming.map(e => renderStudentEventCard(e)).join('')}</div>`
                    }

                    <h3 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2 px-1">
                        <i class="ph-fill ph-images text-orange-500"></i> Archives & Photos
                    </h3>
                    ${past.length === 0 
                        ? `<div class="text-center text-sm text-slate-400 py-4">Historique vide.</div>` 
                        : `<div class="flex flex-col gap-3">${past.map(e => renderStudentEventCard(e)).join('')}</div>`
                    }
                </div>
            `;
        }

        function renderStudentEventCard(event) {
            const dateObj = new Date(event.date);
            const dateStr = dateObj.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
            
            // Check inscription based on eventId and userId
            const inscriptionId = `${event.id}_${state.user.uid}`;
            const isRegistered = state.inscriptions.some(i => i.id === inscriptionId);
            
            let actionBtn = '';
            
            if (!event.isPast) {
                if (isRegistered) {
                    actionBtn = `
                        <button data-action="unregister" data-id="${event.id}" class="w-full mt-3 bg-green-50 text-green-700 font-bold rounded-xl px-4 py-2.5 transition active:scale-95 border-2 border-green-500 flex justify-center items-center gap-2">
                            <i class="ph-bold ph-check"></i> Inscrit (Annuler)
                        </button>`;
                } else {
                    actionBtn = `
                        <button data-action="register" data-id="${event.id}" class="w-full mt-3 bg-blue-600 text-white font-bold rounded-xl px-4 py-2.5 hover:bg-blue-700 transition active:scale-95 shadow-md shadow-blue-600/20 flex justify-center items-center">
                            M'inscrire
                        </button>`;
                }
            } else if (event.edunuageLink) {
                actionBtn = `
                    <a href="${event.edunuageLink}" target="_blank" class="w-full mt-3 bg-orange-100 text-orange-700 font-bold rounded-xl px-4 py-2.5 hover:bg-orange-200 transition active:scale-95 flex justify-center items-center gap-2 block text-center">
                        <i class="ph-fill ph-camera text-lg"></i> Voir l'album
                    </a>`;
            }

            return `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 relative overflow-hidden ${event.isPast ? 'opacity-90' : ''}">
                    ${!event.isPast && isRegistered ? `<div class="absolute top-0 right-0 w-2 h-full bg-green-500"></div>` : ''}
                    <div class="flex justify-between items-start mb-1">
                        <div class="text-blue-600 text-sm font-bold uppercase tracking-wider bg-blue-50 px-2 py-0.5 rounded-md">
                            ${dateStr}
                        </div>
                    </div>
                    <h4 class="font-bold text-lg text-slate-900 leading-tight mb-1">${event.titre}</h4>
                    <p class="text-sm text-slate-500 flex items-center gap-1 mb-2 font-medium">
                        <i class="ph-fill ph-map-pin text-slate-400"></i> ${event.lieu}
                    </p>
                    ${event.description ? `<p class="text-sm text-slate-600 bg-slate-50 p-2 rounded-lg italic mb-2">${event.description}</p>` : ''}
                    ${actionBtn}
                </div>
            `;
        }

        function renderAdminDashboard() {
            // Newest dates first usually better for admin, or separate future/past
            const sortedEvents = [...state.events].sort((a, b) => b.date.localeCompare(a.date));

            return `
                <div class="fade-in">
                    <div class="bg-orange-100 text-orange-800 p-3 rounded-xl mb-6 flex items-center gap-3 font-semibold text-sm border border-orange-200">
                        <i class="ph-fill ph-shield-star text-2xl"></i>
                        Mode Administrateur activé
                    </div>

                    <!-- Add Event Form -->
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-8 relative">
                        <div class="absolute -top-3 left-4 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-sm">Nouveau</div>
                        <h3 class="font-bold text-slate-800 mb-4 mt-2">Créer un événement</h3>
                        
                        <form id="admin-event-form" class="space-y-3">
                            <input type="text" id="ev-titre" required placeholder="Titre (ex: Cross Départemental)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white transition">
                            <div class="flex gap-3">
                                <input type="date" id="ev-date" required class="w-[45%] bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-600">
                                <input type="text" id="ev-lieu" required placeholder="Lieu" class="w-[55%] bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white transition">
                            </div>
                            <textarea id="ev-desc" placeholder="Description courte / Consignes" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm resize-none focus:bg-white transition"></textarea>
                            <input type="url" id="ev-link" placeholder="Lien album Edunuage (Optionnel)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:bg-white transition">
                            
                            <button type="submit" class="w-full bg-slate-800 text-white font-bold rounded-xl px-4 py-2.5 hover:bg-slate-900 transition flex justify-center items-center gap-2">
                                <i class="ph-bold ph-plus"></i> Ajouter au calendrier
                            </button>
                        </form>
                    </div>

                    <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2 px-1">
                        <i class="ph-fill ph-list-dashes text-slate-600"></i> Événements (${state.events.length})
                    </h3>
                    
                    <div class="flex flex-col gap-4">
                        ${sortedEvents.length === 0 ? '<p class="text-sm text-slate-400 text-center py-4">Aucun événement créé.</p>' : ''}
                        ${sortedEvents.map(e => renderAdminEventCard(e)).join('')}
                    </div>
                </div>
            `;
        }

        function renderAdminEventCard(event) {
            // Find participants by matching inscriptions
            const eventInscriptions = state.inscriptions.filter(i => i.eventId === event.id);
            const participants = eventInscriptions.map(i => {
                const user = state.allUsers.find(u => u.id === i.userId);
                return user || { prenom: 'Utilisateur', nom: 'Supprimé', classe: '?', telResponsable: '?' };
            }).sort((a,b) => a.nom.localeCompare(b.nom)); // Sort alphabetically

            return `
                <div class="bg-white p-4 rounded-2xl shadow-sm border ${event.isPast ? 'border-slate-200 bg-slate-50 opacity-80' : 'border-blue-200'}">
                    <div class="flex justify-between items-start mb-2 border-b border-slate-100 pb-2">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-slate-500">${event.date}</span>
                                ${event.isPast ? '<span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded uppercase font-bold">Terminé</span>' : ''}
                            </div>
                            <h4 class="font-bold text-slate-900 text-lg">${event.titre}</h4>
                        </div>
                        <div class="flex gap-2">
                            <button data-action="toggle-past" data-id="${event.id}" data-state="${event.isPast}" class="text-slate-400 hover:text-orange-500 p-1 bg-slate-100 rounded" title="Marquer passé/à venir">
                                <i class="ph-bold ${event.isPast ? 'ph-arrow-counter-clockwise' : 'ph-archive'} text-lg"></i>
                            </button>
                            <button data-action="delete-event" data-id="${event.id}" class="text-slate-400 hover:text-red-600 p-1 bg-slate-100 rounded" title="Supprimer">
                                <i class="ph-bold ph-trash text-lg"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="bg-blue-50 rounded-xl p-3">
                        <div class="flex justify-between items-center cursor-pointer select-none" data-action="toggle-participants" data-id="${event.id}">
                            <span class="text-sm font-bold text-blue-900"><i class="ph-fill ph-users"></i> ${participants.length} Inscrit(s)</span>
                            <i class="ph-bold ph-caret-down text-blue-400 pointer-events-none"></i>
                        </div>
                        
                        <div id="part-${event.id}" class="hidden flex-col gap-2 mt-3 pt-3 border-t border-blue-100">
                            ${participants.length === 0 
                                ? '<span class="text-xs text-slate-500 italic text-center">Personne pour le moment</span>'
                                : participants.map(p => `
                                    <div class="text-xs flex justify-between items-center bg-white p-2 rounded border border-blue-100">
                                        <div><span class="font-bold text-slate-800">${p.nom.toUpperCase()}</span> ${p.prenom} <span class="text-slate-400">(${p.classe})</span></div>
                                        <a href="tel:${p.telResponsable}" class="text-blue-600 bg-blue-50 p-1.5 rounded-md hover:bg-blue-100"><i class="ph-fill ph-phone"></i></a>
                                    </div>
                                `).join('')
                            }
                        </div>
                    </div>
                </div>
            `;
        }

        // --- EVENT LISTENERS & ACTIONS ---

        // Toast System
        let toastTimeout;
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').className = type === 'error' ? 'ph-fill ph-warning-circle text-xl text-red-400' : 'ph-fill ph-check-circle text-xl text-green-400';
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Button Clicks
        document.addEventListener('click', async (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const action = btn.dataset.action;
            const id = btn.dataset.id;

            try {
                // NAVIGATION
                if (action === 'go-login') { state.view = 'LOGIN'; render(); }
                if (action === 'go-guard') { state.view = 'GUARD'; render(); }
                if (action === 'logout') { await signOut(auth); }

                // GUARD CHECK
                if (action === 'check-guard') {
                    const code = document.getElementById('guard-input').value.trim();
                    if (code === 'Rouillac16') {
                        state.view = 'REGISTER';
                        render();
                    } else {
                        showToast("Code invalide", "error");
                    }
                }

                // STUDENT: REGISTER/UNREGISTER TO EVENT
                if (action === 'register') {
                    if (!state.user) return;
                    btn.innerHTML = `<i class="ph ph-spinner animate-spin"></i>`;
                    const docId = `${id}_${state.user.uid}`;
                    await setDoc(getDocRef('inscriptions', docId), {
                        eventId: id,
                        userId: state.user.uid,
                        timestamp: Date.now()
                    });
                    showToast("Inscription validée !");
                }
                if (action === 'unregister') {
                    if (!state.user) return;
                    btn.innerHTML = `<i class="ph ph-spinner animate-spin"></i>`;
                    const docId = `${id}_${state.user.uid}`;
                    await deleteDoc(getDocRef('inscriptions', docId));
                    showToast("Inscription annulée");
                }

                // ADMIN: TOGGLE LIST
                if (action === 'toggle-participants') {
                    const list = document.getElementById(`part-${id}`);
                    if (list) {
                        list.classList.toggle('hidden');
                        list.classList.toggle('flex');
                    }
                }

                // ADMIN: TOGGLE PAST
                if (action === 'toggle-past') {
                    const isPast = btn.dataset.state === 'true';
                    await updateDoc(getDocRef('evenements', id), { isPast: !isPast });
                    showToast(isPast ? "Remis en 'À venir'" : "Marqué comme terminé");
                }

                // ADMIN: DELETE EVENT
                if (action === 'delete-event') {
                    if (confirm("Supprimer cet événement définitivement ? (Les inscriptions liées resteront en base mais invisibles)")) {
                        await deleteDoc(getDocRef('evenements', id));
                        showToast("Événement supprimé");
                    }
                }

            } catch (err) {
                console.error(err);
                showToast("Une erreur est survenue", "error");
            }
        });

        // Form Submissions
        document.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                // LOGIN
                if (e.target.id === 'login-form') {
                    const btn = e.target.querySelector('button[type="submit"]');
                    btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i>';
                    
                    const email = document.getElementById('login-email').value;
                    const pwd = document.getElementById('login-password').value;
                    
                    await signInWithEmailAndPassword(auth, email, pwd);
                    // onAuthStateChanged handles routing
                }

                // REGISTER
                if (e.target.id === 'register-form') {
                    const btn = document.getElementById('btn-register-submit');
                    btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Création...';
                    btn.disabled = true;

                    const email = document.getElementById('reg-email').value;
                    const pwd = document.getElementById('reg-password').value;
                    const data = {
                        prenom: document.getElementById('reg-prenom').value.trim(),
                        nom: document.getElementById('reg-nom').value.trim(),
                        sexe: document.querySelector('input[name="sexe"]:checked').value,
                        classe: document.getElementById('reg-classe').value,
                        telResponsable: document.getElementById('reg-tel').value.trim(),
                        email: email,
                        role: 'eleve'
                    };

                    // Create auth user
                    const userCredential = await createUserWithEmailAndPassword(auth, email, pwd);
                    const uid = userCredential.user.uid;

                    // Save profile to Firestore
                    await setDoc(getDocRef('utilisateurs', uid), data);
                    
                    // The onAuthStateChanged will redirect them to STUDENT view
                }

                // ADMIN: ADD EVENT
                if (e.target.id === 'admin-event-form') {
                    const btn = e.target.querySelector('button[type="submit"]');
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i>';
                    
                    const data = {
                        titre: document.getElementById('ev-titre').value.trim(),
                        date: document.getElementById('ev-date').value,
                        lieu: document.getElementById('ev-lieu').value.trim(),
                        description: document.getElementById('ev-desc').value.trim(),
                        edunuageLink: document.getElementById('ev-link').value.trim(),
                        isPast: false
                    };

                    await addDoc(getCollectionRef('evenements'), data);
                    e.target.reset();
                    btn.innerHTML = originalText;
                    showToast("Événement ajouté !");
                }

            } catch (err) {
                console.error(err);
                const btn = e.target.querySelector('button[type="submit"]');
                if(btn) btn.disabled = false;
                
                // Friendly error messages
                let msg = "Erreur de connexion";
                if (err.code === 'auth/email-already-in-use') msg = "Cet email est déjà utilisé.";
                if (err.code === 'auth/invalid-credential') msg = "Email ou mot de passe incorrect.";
                if (err.code === 'auth/weak-password') msg = "Mot de passe trop faible (6 caractères min).";
                
                showToast(msg, "error");
                render(); // Re-render to reset button states
            }
        });

    </script>
</body>
</html>
